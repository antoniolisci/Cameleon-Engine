name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync src/ → ovh-deploy/
        run: |
          cp -r src/js/*  ovh-deploy/js/
          cp -r src/css/* ovh-deploy/css/
          cp src/index.html ovh-deploy/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ovh-deploy
          publish_branch: gh-pages
          cname: cameleonengine.fr
          force_orphan: true
